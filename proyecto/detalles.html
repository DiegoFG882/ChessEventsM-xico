<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del Torneo - ChessEvents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 font-sans">

    <div id="detalleContenedor" class="min-h-screen pb-20">
        <div class="flex justify-center items-center h-screen">
            <p class="text-slate-400 animate-pulse font-bold">Cargando detalles del torneo...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
        apiKey: "AIzaSyARAiL3nTEOURSaH2LooV30zR2tHXsqCMg",
        authDomain: "chesseventsmexico.firebaseapp.com",
        databaseURL: "https://chesseventsmexico-default-rtdb.firebaseio.com",
        projectId: "chesseventsmexico",
        storageBucket: "chesseventsmexico.firebasestorage.app",
        messagingSenderId: "197234586613",
        appId: "1:197234586613:web:771e024dadf5c88d75e6bc",
        measurementId: "G-SM8WSGZB56"
    };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function cargarDetalle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                window.location.href = "index.html";
                return;
            }

            db.ref('torneos/' + id).on('value', (snapshot) => {
                const t = snapshot.val();
                const contenedor = document.getElementById('detalleContenedor');

                if (!t) {
                    contenedor.innerHTML = `<div class="text-center py-20 text-slate-500">El torneo no existe o fue eliminado.</div>`;
                    return;
                }

                // Formatear mensaje de WhatsApp
                const mensajeWA = encodeURIComponent(`Hola, me interesa participar en el torneo: ${t.nombre}`);
                const linkWA = t.whatsapp ? `https://wa.me/${t.whatsapp}?text=${mensajeWA}` : "#";

                contenedor.innerHTML = `
                    <div class="bg-indigo-900 h-64 w-full absolute top-0 left-0 -z-10"></div>
                    
                    <div class="max-w-4xl mx-auto px-4 pt-10">
                        <a href="index.html" class="text-white/70 hover:text-white font-bold text-sm flex items-center gap-2 mb-6 transition">
                            ← Volver a la lista
                        </a>

                        <div class="bg-white rounded-[40px] shadow-2xl overflow-hidden border border-slate-100">
                            <div class="p-8 md:p-12">
                                <div class="flex flex-wrap gap-2 mb-4">
                                    <span class="bg-indigo-100 text-indigo-700 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">${t.ritmo}</span>
                                    ${t.esFide ? '<span class="bg-amber-100 text-amber-700 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Válido FIDE</span>' : ''}
                                </div>

                                <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4 leading-tight">${t.nombre}</h1>
                                
                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 my-10 bg-slate-50 p-8 rounded-[32px]">
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1">Fecha del evento</p>
                                        <p class="text-lg font-bold text-slate-800">📅 ${t.fecha}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1">Hora de inicio</p>
                                        <p class="text-lg font-bold text-slate-800">⏰ ${t.hora || 'Ver bases'}</p>
                                    </div>
                                    <div>
                                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-tighter mb-1">Costo de inscripción</p>
                                        <p class="text-2xl font-black text-indigo-600">${t.costo}</p>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                                    <div class="space-y-6">
                                        <h3 class="text-xl font-black text-slate-900 flex items-center gap-2">📍 Ubicación</h3>
                                        <p class="text-slate-600 leading-relaxed font-medium">${t.direccion}<br><b class="text-slate-900">${t.estado}</b></p>
                                        
                                        ${t.maps ? `
                                            <a href="${t.maps}" target="_blank" class="inline-flex items-center gap-2 text-indigo-600 font-bold hover:underline">
                                                Ver en Google Maps →
                                            </a>
                                        ` : ''}

                                        <div class="pt-6">
                                            <h3 class="text-xl font-black text-slate-900 mb-4">🏆 Detalles Técnicos</h3>
                                            <ul class="space-y-3 text-slate-600 font-medium">
                                                <li>• Sistema: Suizo a ${t.rondas} rondas</li>
                                                <li>• Ritmo: ${t.ritmoDetalle || 'No especificado'}</li>
                                                <li>• Organizado por: ${t.autor}</li>
                                            </ul>
                                        </div>
                                    </div>

                                    <div class="bg-indigo-900 rounded-[32px] p-8 text-white flex flex-col justify-between shadow-xl shadow-indigo-200">
                                        <div>
                                            <h3 class="text-xl font-black mb-2">¡Inscríbete ahora!</h3>
                                            <p class="text-indigo-200 text-sm mb-8 font-medium">Contacta al organizador para asegurar tu lugar en el torneo.</p>
                                        </div>
                                        
                                        <div class="space-y-3">
                                            <a href="${linkWA}" target="_blank" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-3 transition-transform active:scale-95 shadow-lg">
                                                Contactar por WhatsApp
                                            </a>
                                            
                                            ${t.redSocial ? `
                                                <a href="${t.redSocial}" target="_blank" class="w-full bg-white/10 hover:bg-white/20 text-white py-4 rounded-2xl font-bold flex items-center justify-center transition">
                                                    Ver Red Social
                                                </a>
                                            ` : ''}
                                        </div>

                                        <div class="mt-8 pt-8 border-t border-white/10 text-center">
                                            <p class="text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-4">Convocatoria Oficial</p>
                                            ${t.archivoContenido ? 
                                                `<button onclick="abrirArchivo('${t.id}')" class="w-full bg-white text-indigo-900 py-3 rounded-xl font-bold hover:bg-indigo-50 transition">Ver Convocatoria PDF</button>` : 
                                                `<p class="text-xs text-indigo-400 italic">No se subió archivo PDF</p>`
                                            }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function abrirArchivo(id) {
            db.ref('torneos/' + id).once('value', (snapshot) => {
                const torneo = snapshot.val();
                if (torneo && torneo.archivoContenido) {
                    const win = window.open();
                    win.document.write(`<iframe src="${torneo.archivoContenido}" frameborder="0" style="width:100%; height:100%; position:fixed; top:0; left:0;"></iframe>`);
                } else {
                    alert("El archivo no está disponible.");
                }
            });
        }

        window.onload = cargarDetalle;
    </script>
</body>
</html>
