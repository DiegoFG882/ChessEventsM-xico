<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ChessEvents - Panel Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-white p-8">

    <div id="loginAdmin" class="max-w-md mx-auto mt-20 bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <h2 class="text-2xl font-black mb-6 text-center text-indigo-400">ADMIN LOGIN</h2>
        <input type="text" id="adminUser" placeholder="Usuario" class="w-full p-3 mb-4 rounded bg-slate-700 border border-slate-600 outline-none focus:border-indigo-500">
        <input type="password" id="adminPass" placeholder="Contraseña" class="w-full p-3 mb-6 rounded bg-slate-700 border border-slate-600 outline-none focus:border-indigo-500">
        <button onclick="accesoAdmin()" class="w-full bg-indigo-600 py-3 rounded-xl font-bold hover:bg-indigo-700 transition">ENTRAR AL PANEL</button>
    </div>

    <div id="panelControl" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-end mb-10">
            <div>
                <h1 class="text-4xl font-black">Panel de Control</h1>
                <p class="text-gray-400">Gestiona todos los torneos de la plataforma</p>
            </div>
            <button onclick="location.reload()" class="text-xs text-gray-500 hover:text-white underline">Cerrar Sesión Admin</button>
        </div>

        <div class="grid grid-cols-1 gap-4" id="listaTodosTorneos">
            <p class="text-slate-500 italic">Cargando base de datos...</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
        apiKey: "AIzaSyARAiL3nTEOURSaH2LooV30zR2tHXsqCMg",
        authDomain: "chesseventsmexico.firebaseapp.com",
        databaseURL: "https://chesseventsmexico-default-rtdb.firebaseio.com",
        projectId: "chesseventsmexico",
        storageBucket: "chesseventsmexico.firebasestorage.app",
        messagingSenderId: "197234586613",
        appId: "1:197234586613:web:771e024dadf5c88d75e6bc",
        measurementId: "G-SM8WSGZB56"
    };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function accesoAdmin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            // Credenciales maestras
            if(user === "Diego" && pass === "Messi10") {
                document.getElementById('loginAdmin').classList.add('hidden');
                document.getElementById('panelControl').classList.remove('hidden');
                cargarTodoParaAdmin();
            } else {
                alert("Credenciales incorrectas. Acceso denegado.");
            }
        }

        function cargarTodoParaAdmin() {
            db.ref('torneos').on('value', (snapshot) => {
                const lista = document.getElementById('listaTodosTorneos');
                lista.innerHTML = "";
                
                if (!snapshot.exists()) {
                    lista.innerHTML = "<p class='text-center py-10 text-slate-600'>No hay torneos activos en la base de datos.</p>";
                    return;
                }

                snapshot.forEach((child) => {
                    const t = child.val();
                    lista.innerHTML += `
                        <div class="bg-slate-800 p-6 rounded-2xl flex justify-between items-center border border-slate-700 hover:border-slate-500 transition">
                            <div>
                                <h3 class="font-bold text-white text-lg">${t.nombre}</h3>
                                <p class="text-[10px] text-indigo-400 font-black uppercase tracking-widest mt-1">Organizador: ${t.autor || 'Anónimo'}</p>
                                <p class="text-xs text-gray-500 mt-1">ID: ${child.key} | Estado: ${t.estado}</p>
                            </div>
                            <div class="flex gap-3">
                                <button onclick="eliminarTorneoAdmin('${child.key}')" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-500 hover:text-white transition">
                                    ELIMINAR TORNEO
                                </button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function eliminarTorneoAdmin(id) {
            if(confirm("¿ESTÁS SEGURO? Como administrador, eliminarás este torneo de forma permanente para todos los usuarios.")) {
                db.ref('torneos/' + id).remove()
                    .then(() => alert("Torneo eliminado por el administrador."))
                    .catch(err => alert("Error: " + err.message));
            }
        }
    </script>
</body>
</html>
